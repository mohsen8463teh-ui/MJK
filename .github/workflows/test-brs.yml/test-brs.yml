name: BRS FINAL TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: BRS API
        env:
          KEY: ${{ secrets.BRS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request

          key = os.environ["KEY"]
          symbol = "فملی"

          for typ, name in [(0, "PRICE"), (1, "TRUE_LEGAL")]:
              url = "https://Api.BrsApi.ir/Tsetmc/History.php?" + urllib.parse.urlencode({
                  "key": key,
                  "type": typ,
                  "l18": symbol
              })

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MJK"}
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode("utf-8"))

              rows = data if isinstance(data, list) else data.get("data", [])

              print("=" * 50)
              print(name)
              print("HTTP: 200")
              print("ROWS:", len(rows))

              if not rows:
                  raise Exception(name + " returned ZERO rows")

              print("FIRST ROW:")
              print(json.dumps(rows[0], ensure_ascii=False, indent=2))

          print("=" * 50)
          print("BRS FINAL TEST: SUCCESS")
          PY
