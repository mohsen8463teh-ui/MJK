name: TEST BRS API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test BRS API
        shell: python
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: |
          import os
          import sys
          import json
          import urllib.parse
          import urllib.request

          api_key = os.environ.get("BRS_API_KEY")

          if not api_key:
              print("ERROR: BRS_API_KEY secret not found")
              sys.exit(1)

          symbol = "فملی"

          params = {
              "key": api_key,
              "type": "0",
              "l18": symbol
          }

          url = (
              "https://Api.BrsApi.ir/Tsetmc/History.php?"
              + urllib.parse.urlencode(params)
          )

          print("Testing BRS API")
          print("Symbol:", symbol)
          print("Secret detected: YES")
          print("Sending request...")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MJK-BRS-Test/1.0",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=20
              ) as response:

                  status = response.status
                  body = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          except Exception as error:
              print("BRS REQUEST FAILED")
              print(type(error).__name__)
              print(str(error))
              sys.exit(1)

          print("HTTP STATUS:", status)
          print("RESPONSE LENGTH:", len(body))

          if status != 200:
              print(body[:1000])
              sys.exit(1)

          if not body.strip():
              print("ERROR: Empty response")
              sys.exit(1)

          try:
              data = json.loads(body)
          except Exception:
              print("ERROR: Response is not valid JSON")
              print(body[:1000])
              sys.exit(1)

          print("JSON: VALID")

          if isinstance(data, list):
              print("ROWS:", len(data))

              if data:
                  print("FIRST ROW:")
                  print(
                      json.dumps(
                          data[0],
                          ensure_ascii=False,
                          indent=2
                      )
                  )

          elif isinstance(data, dict):
              print("RESPONSE KEYS:")
              print(list(data.keys()))

              print("RESPONSE:")
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )[:3000]
              )

          else:
              print("RESPONSE TYPE:", type(data).__name__)

          print("")
          print("==============================")
          print("BRS API TEST FINISHED")
          print("==============================")
