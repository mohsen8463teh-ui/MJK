name: TEST BRS API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-brs-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test BRS API
        shell: python
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: |
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          api_key = os.environ.get("BRS_API_KEY")

          if not api_key:
              raise RuntimeError(
                  "BRS_API_KEY GitHub Secret was not found."
              )

          symbol = "فملی"

          print("Testing BRS API...")
          print("Symbol:", symbol)
          print("API key detected: YES")
          print("API key value will NOT be printed.")

          base = "https://Api.BrsApi.ir/Tsetmc/History.php"

          params = {
              "key": api_key,
              "type": "0",
              "l18": symbol
          }

          url = base + "?" + urllib.parse.urlencode(params)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "MJK-Data-Test/1.0",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  status = response.status
                  body = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

          except Exception as e:
              print("BRS CONNECTION FAILED")
              print(type(e).__name__)
              print(str(e))
              sys.exit(1)

          print("HTTP STATUS:", status)
          print("RESPONSE LENGTH:", len(body))

          if status != 200:
              raise RuntimeError(
                  f"BRS API returned HTTP {status}"
              )

          if not body.strip():
              raise RuntimeError(
                  "BRS API returned an empty response."
              )

          try:
              data = json.loads(body)
          except Exception:
              print("Response is not valid JSON.")
              print(body[:1000])
              raise

          print("JSON RESPONSE: VALID")

          if isinstance(data, list):
              rows = data
          elif isinstance(data, dict):
              rows = (
                  data.get("data")
                  or data.get("history")
                  or data.get("result")
                  or data
              )
          else:
              rows = []

          if isinstance(rows, list):
              print("ROWS:", len(rows))

              if len(rows) > 0:
                  print("FIRST ROW:")
                  print(
                      json.dumps(
                          rows[0],
                          ensure_ascii=False,
                          indent=2
                      )
                  )
          else:
              print("RESPONSE OBJECT:")
              print(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )[:3000]
              )

          print("")
          print("================================")
          print("BRS API TEST FINISHED")
          print("================================")
