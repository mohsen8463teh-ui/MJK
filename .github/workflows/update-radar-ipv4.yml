name: Update MJK Daily Market Radar

on:
  workflow_dispatch:

  # 12:45 Tehran = 09:15 UTC
  # Trading days in Iran: Saturday through Wednesday
  schedule:
    - cron: '15 9 * * 0,1,2,3,6'

permissions:
  contents: write

concurrency:
  group: mjk-daily-radar
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch TSETMC daily snapshot
        shell: python
        run: |
          import json
          import os
          import sys
          import time
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          TEHRAN = ZoneInfo("Asia/Tehran")
          now_utc = datetime.now(timezone.utc)
          now_tehran = now_utc.astimezone(TEHRAN)

          print("UTC:", now_utc.isoformat())
          print("Tehran:", now_tehran.isoformat())

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/131.0 Safari/537.36"
              ),
              "Accept": "*/*",
              "Accept-Encoding": "gzip, deflate",
              "Connection": "close",
          }

          # Legacy TSETMC endpoint.
          # Try multiple host variants so a temporary host issue
          # does not immediately kill the snapshot.
          URLS = [
              "http://old.tsetmc.com/tsev2/data/MarketWatchInit.aspx?h=0&r=0",
              "https://old.tsetmc.com/tsev2/data/MarketWatchInit.aspx?h=0&r=0",
              "http://www.tsetmc.com/tsev2/data/MarketWatchInit.aspx?h=0&r=0",
          ]

          CLIENT_URLS = [
              "http://old.tsetmc.com/tsev2/data/ClientTypeAll.aspx",
              "https://old.tsetmc.com/tsev2/data/ClientTypeAll.aspx",
              "http://www.tsetmc.com/tsev2/data/ClientTypeAll.aspx",
          ]

          def fetch(url, timeout=45):
              req = Request(url, headers=HEADERS, method="GET")
              with urlopen(req, timeout=timeout) as response:
                  raw = response.read()
                  return raw.decode("utf-8-sig", errors="replace")

          def fetch_with_retry(urls, name):
              last_error = None

              for url in urls:
                  for attempt in range(3):
                      try:
                          print(f"[{name}] {url} attempt {attempt + 1}/3")
                          text = fetch(url)

                          if not text or len(text) < 100:
                              raise RuntimeError(
                                  f"Empty/too-small response: {len(text)} bytes"
                              )

                          print(f"[{name}] received {len(text)} bytes")
                          return text, url

                      except Exception as exc:
                          last_error = exc
                          print(f"[{name}] failed: {exc}")
                          time.sleep(3 * (attempt + 1))

              raise RuntimeError(
                  f"{name} failed on all endpoints. Last error: {last_error}"
              )

          def to_int(value):
              if value is None:
                  return None

              value = str(value).strip()

              if value == "":
                  return None

              try:
                  return int(float(value))
              except Exception:
                  return None

          def to_float(value):
              if value is None:
                  return None

              value = str(value).strip()

              if value == "":
                  return None

              try:
                  return float(value)
              except Exception:
                  return None

          # ------------------------------------------------------------
          # 1) MARKET WATCH
          # ------------------------------------------------------------

          raw_market, market_source = fetch_with_retry(
              URLS,
              "MARKET-WATCH"
          )

          parts = raw_market.split("@")

          if len(parts) < 5:
              raise RuntimeError(
                  f"Unexpected MarketWatchInit response. Parts={len(parts)}"
              )

          market_state_raw = parts[1]
          price_rows_raw = parts[2]
          ref_id_raw = parts[4]

          if not price_rows_raw.strip():
              raise RuntimeError(
                  "TSETMC returned an empty price table. "
                  "Existing radar data will NOT be overwritten."
              )

          # TSETMC price rows have 26 columns:
          #
          # 0 ins_code
          # 1 isin
          # 2 symbol
          # 3 name
          # 4 heven
          # 5 pf
          # 6 pc
          # 7 pl
          # 8 tno
          # 9 tvol
          # 10 tval
          # 11 pmin
          # 12 pmax
          # 13 py
          # 14 eps
          # 15 bvol
          # 16 visitcount
          # 17 flow
          # 18 cs
          # 19 tmax
          # 20 tmin
          # 21 z
          # 22 yval
          # 23 predtran
          # 24 buyop
          # 25 cgrvalcot

          market = []

          for raw_row in price_rows_raw.split(";"):
              raw_row = raw_row.strip()

              if not raw_row:
                  continue

              fields = raw_row.split(",")

              if len(fields) < 23:
                  continue

              symbol = fields[2].strip()
              name = fields[3].strip()
              ins_code = fields[0].strip()

              if not symbol or not ins_code:
                  continue

              previous = to_int(fields[13])
              last_price = to_int(fields[7])
              close_price = to_int(fields[6])

              change_percent = None

              if previous not in (None, 0) and last_price is not None:
                  change_percent = round(
                      ((last_price - previous) / previous) * 100,
                      4
                  )

              item = {
                  "insCode": ins_code,
                  "isin": fields[1].strip(),
                  "symbol": symbol,
                  "name": name,
                  "lastTradeTime": fields[4].strip(),

                  "open": to_int(fields[5]),
                  "close": close_price,
                  "last": last_price,
                  "yesterday": previous,

                  "tradeCount": to_int(fields[8]),
                  "volume": to_int(fields[9]),
                  "value": to_int(fields[10]),

                  "low": to_int(fields[11]),
                  "high": to_int(fields[12]),

                  "eps": to_float(fields[14]),
                  "baseVolume": to_int(fields[15]),

                  "flow": to_int(fields[17]),

                  "maxAllowed": to_float(fields[19]),
                  "minAllowed": to_float(fields[20]),

                  "shareCount": to_int(fields[21]),
                  "symbolType": fields[22].strip(),

                  "changePercent": change_percent,

                  "source": "TSETMC",
                  "snapshotTimeUTC": now_utc.isoformat(),
                  "snapshotTimeTehran": now_tehran.isoformat(),
              }

              market.append(item)

          if len(market) < 100:
              raise RuntimeError(
                  f"Market snapshot suspiciously small: {len(market)} rows. "
                  "Existing data will NOT be overwritten."
              )

          print(f"Valid market rows: {len(market)}")

          # ------------------------------------------------------------
          # 2) CLIENT TYPE / حقیقی حقوقی
          # ------------------------------------------------------------

          client_map = {}
          client_source = None

          try:
              raw_client, client_source = fetch_with_retry(
                  CLIENT_URLS,
                  "CLIENT-TYPE"
              )

              for raw_row in raw_client.split(";"):
                  raw_row = raw_row.strip()

                  if not raw_row:
                      continue

                  fields = raw_row.split(",")

                  if len(fields) < 9:
                      continue

                  ins_code = fields[0].strip()

                  if not ins_code:
                      continue

                  client_map[ins_code] = {
                      "naturalBuyCount": to_int(fields[1]),
                      "legalBuyCount": to_int(fields[2]),
                      "naturalBuyVolume": to_int(fields[3]),
                      "legalBuyVolume": to_int(fields[4]),
                      "naturalSellCount": to_int(fields[5]),
                      "legalSellCount": to_int(fields[6]),
                      "naturalSellVolume": to_int(fields[7]),
                      "legalSellVolume": to_int(fields[8]),
                  }

              print(f"Client-type rows: {len(client_map)}")

          except Exception as exc:
              # Client type is supplementary.
              # Do NOT destroy an otherwise valid market snapshot.
              print("WARNING: ClientType unavailable:", exc)

          # Merge client type into market rows.
          for item in market:
              ct = client_map.get(item["insCode"])

              if ct:
                  item["clientType"] = ct

                  nbv = ct["naturalBuyVolume"] or 0
                  lbv = ct["legalBuyVolume"] or 0
                  nsv = ct["naturalSellVolume"] or 0
                  lsv = ct["legalSellVolume"] or 0

                  item["naturalNetVolume"] = nbv - nsv
                  item["legalNetVolume"] = lbv - lsv

                  item["clientTypeAvailable"] = True
              else:
                  item["clientType"] = None
                  item["naturalNetVolume"] = None
                  item["legalNetVolume"] = None
                  item["clientTypeAvailable"] = False

          # ------------------------------------------------------------
          # 3) MARKET FILTER
          # ------------------------------------------------------------

          # flow:
          # 1 = بورس
          # 2 = فرابورس
          # 4 = بازار پایه
          #
          # Keep only these for the stock radar.
          stocks = [
              x for x in market
              if x.get("flow") in (1, 2, 4)
          ]

          if len(stocks) < 50:
              raise RuntimeError(
                  f"Filtered stock universe is suspiciously small: {len(stocks)}"
              )

          # ------------------------------------------------------------
          # 4) MARKET OVERVIEW
          # ------------------------------------------------------------

          overview = {
              "rawMarketState": market_state_raw,
              "refId": ref_id_raw,
              "totalMarketRows": len(market),
              "stockRows": len(stocks),
          }

          # ------------------------------------------------------------
          # 5) SNAPSHOT OBJECT
          # ------------------------------------------------------------

          snapshot_date = now_tehran.strftime("%Y-%m-%d")

          snapshot = {
              "schemaVersion": 2,
              "market": "iran",
              "marketName": "TSETMC",
              "snapshotDate": snapshot_date,
              "snapshotTimeUTC": now_utc.isoformat(),
              "snapshotTimeTehran": now_tehran.isoformat(),

              "dataStatus": "VALID",

              "source": {
                  "marketWatch": market_source,
                  "clientType": client_source,
              },

              "dataIntegrity": {
                  "lookaheadUsed": False,
                  "fabricatedValues": False,
                  "marketWatchRows": len(market),
                  "stockRows": len(stocks),
                  "clientTypeRows": len(client_map),
              },

              "overview": overview,

              "items": stocks,
          }

          # ------------------------------------------------------------
          # 6) WRITE FILES
          # ------------------------------------------------------------

          os.makedirs("radar-data/daily", exist_ok=True)

          latest_file = "radar-data/stocks.json"
          daily_file = f"radar-data/daily/{snapshot_date}.json"

          with open(latest_file, "w", encoding="utf-8") as f:
              json.dump(
                  snapshot,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          with open(daily_file, "w", encoding="utf-8") as f:
              json.dump(
                  snapshot,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          # Commodities are deliberately NOT fabricated.
          commodities = {
              "schemaVersion": 2,
              "market": "iran",
              "snapshotDate": snapshot_date,
              "snapshotTimeUTC": now_utc.isoformat(),
              "dataStatus": "NOT_AVAILABLE_FROM_THIS_SOURCE",
              "items": []
          }

          with open(
              "radar-data/commodities.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  commodities,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Created:", latest_file)
          print("Created:", daily_file)
          print("Created:", "radar-data/commodities.json")
          print("FINAL STOCK COUNT:", len(stocks))

      - name: Validate snapshot
        shell: bash
        run: |
          set -e

          test -s radar-data/stocks.json
          test -s radar-data/commodities.json

          python - <<'PY'
          import json
          import glob

          with open("radar-data/stocks.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data["dataStatus"] == "VALID"
          assert data["dataIntegrity"]["fabricatedValues"] is False
          assert len(data["items"]) >= 50

          files = glob.glob("radar-data/daily/*.json")
          assert files, "No daily snapshot created"

          print("Validation OK")
          print("Stocks:", len(data["items"]))
          print("Daily snapshots:", len(files))
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "MJK Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar-data/stocks.json
          git add radar-data/commodities.json
          git add radar-data/daily/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: update MJK daily market snapshot"
          git push
