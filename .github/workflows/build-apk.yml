name: Build MJK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MJK source
        run: |
          rm -rf source
          mkdir -p source
          unzip -q MJK_GITHUB_UPLOAD.zip -d source

      - name: Prepare Gradle configuration
        working-directory: source/android
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=35
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cryptopulse.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.mjk.cryptopulse"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.work:work-runtime-ktx:2.10.0")
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        working-directory: source/android
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f source/android/app/build/outputs/apk/release/app-release.apk
          ls -lh source/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MJK-release-apk
          path: source/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
