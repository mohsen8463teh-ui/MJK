name: Update MJK Radar Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/update-radar-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: mjk-radar-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract source package
        run: |
          rm -rf source
          mkdir -p source radar-data
          unzip -q MJK_FINAL_10COINS_DIAGNOSTIC.zip -d source
          test -f source/scripts/update-radar.js
      - name: Fetch TSETMC snapshots
        run: node source/scripts/update-radar.js
      - name: Publish only non-empty snapshots
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          for name in ('stocks.json','commodities.json'):
              src=Path('source/radar-data')/name
              if not src.exists():
                  continue
              data=json.loads(src.read_text(encoding='utf-8'))
              items=data.get('items') or data.get('rows') or []
              if not isinstance(items,list) or not items:
                  raise SystemExit(f'Refusing empty {name}')
              shutil.copy2(src, Path('radar-data')/name)
              print(name, len(items), 'items')
          PY
      - name: Commit changed snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-data/stocks.json radar-data/commodities.json
          if git diff --cached --quiet; then
            echo 'No radar snapshot change.'
          else
            git commit -m 'chore: update Iran market radar snapshot'
            git push
          fi
