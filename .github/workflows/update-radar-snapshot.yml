name: Update MJK Radar Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/update-radar-snapshot.yml'
      - 'scripts/update-radar-github.js'

permissions:
  contents: write

concurrency:
  group: mjk-radar-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch TSETMC snapshots
        run: node scripts/update-radar-github.js

      - name: Validate non-empty snapshots
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for name in ('stocks.json', 'commodities.json'):
              p = Path('radar-data') / name
              if not p.exists():
                  raise SystemExit(f'Missing {p}')
              data = json.loads(p.read_text(encoding='utf-8'))
              items = data.get('items') or data.get('rows') or []
              if not isinstance(items, list) or not items:
                  raise SystemExit(f'Refusing empty {name}')
              print(name, len(items), 'items')
          PY

      - name: Commit changed snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-data/stocks.json radar-data/commodities.json
          if git diff --cached --quiet; then
            echo 'No radar snapshot change.'
          else
            git commit -m 'chore: update Iran market radar snapshot'
            git push
          fi
