name: Update MJK Market Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: mjk-radar-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install radar updater
        shell: bash
        run: |
          mkdir -p scripts radar-data
          cat > scripts/update-radar.js <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const http = require('http');
          const https = require('https');

          const OUT = path.join(process.cwd(), 'radar-data');
          fs.mkdirSync(OUT, { recursive: true });

          const HEADERS = {
            'User-Agent': 'Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/126 Safari/537.36 MJK-Radar/1.0',
            'Accept': '*/*',
            'Accept-Language': 'fa-IR,fa;q=0.9,en;q=0.7',
            'Referer': 'https://www.tsetmc.com/',
            'Origin': 'https://www.tsetmc.com',
            'Connection': 'close'
          };

          function request(url, timeout = 30000) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const lib = u.protocol === 'https:' ? https : http;
              const req = lib.get(u, { headers: HEADERS, timeout }, res => {
                let body = '';
                res.setEncoding('utf8');
                res.on('data', c => body += c);
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(body);
                  } else {
                    reject(new Error(`HTTP ${res.statusCode} ${u.hostname}`));
                  }
                });
              });
              req.on('timeout', () => req.destroy(new Error(`timeout ${u.hostname}`)));
              req.on('error', reject);
            });
          }

          async function getJson(url) {
            const text = await request(url);
            try {
              return JSON.parse(text);
            } catch (e) {
              throw new Error(`invalid JSON from ${new URL(url).hostname}`);
            }
          }

          function n(v) {
            if (v && typeof v === 'object') v = v.value ?? v.Value ?? v.val ?? v.amount ?? v.Amount;
            if (v === null || v === undefined || v === '') return null;
            const x = Number(String(v).replace(/,/g, '').trim());
            return Number.isFinite(x) ? x : null;
          }

          function pick(obj, keys) {
            for (const k of keys) {
              if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
            }
            return null;
          }

          function normalizeModern(x) {
            const last = n(pick(x, ['pDrCotVal', 'lastPrice', 'pl']));
            const prev = n(pick(x, ['priceYesterday', 'yesterdayPrice', 'py']));
            return {
              insCode: String(pick(x, ['insCode', 'InsCode']) ?? ''),
              isin: String(pick(x, ['instrumentId', 'InstrumentId', 'cIsin']) ?? ''),
              symbol: String(pick(x, ['lVal18AFC', 'lVal18', 'symbol']) ?? ''),
              name: String(pick(x, ['lVal30', 'companyNamePersian', 'companyName', 'instrumentName']) ?? ''),
              last,
              close: n(pick(x, ['pClosing', 'closingPrice', 'pc'])),
              prev,
              change: n(pick(x, ['changePercent', 'pct'])) ?? (prev && last !== null ? (last - prev) / prev * 100 : null),
              vol: n(pick(x, ['qTotTran5J', 'tradeVolume', 'volume'])),
              value: n(pick(x, ['qTotCap', 'tradeValue', 'value'])),
              trades: n(pick(x, ['zTotTran', 'tradeCount'])),
              eps: n(x.eps),
              pe: n(x.pe),
              flow: n(pick(x, ['flow', 'Flow'])),
              state: String(pick(x, ['stateName', 'state']) ?? ''),
              source: 'tsetmc-cdn'
            };
          }

          function parseLegacy(text) {
            const parts = String(text).split('@');
            const rows = [];

            for (const part of parts) {
              const a = part.split(',');
              if (a.length < 26) continue;

              const insCode = a[0];
              const isin = a[1];
              const symbol = a[2];

              if (!insCode || !symbol) continue;

              const last = n(a[6]);
              const prev = n(a[7]);

              rows.push({
                insCode: String(insCode),
                isin: String(isin || ''),
                symbol: String(symbol),
                name: String(a[3] || symbol),
                last,
                close: n(a[5]),
                prev,
                change: n(a[25]) ?? (prev && last !== null ? (last - prev) / prev * 100 : null),
                vol: n(a[10]),
                value: n(a[11]),
                trades: n(a[8]),
                eps: n(a[14]),
                pe: null,
                flow: n(a[17]),
                state: '',
                bidVolume: n(a[15]),
                source: 'tsetmc-legacy'
              });
            }

            return rows.filter(x => x.symbol && x.last !== null);
          }

          async function marketWatch() {
            const modern =
              'https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&industrialGroup=&paperTypes%5B0%5D=1&paperTypes%5B1%5D=2&paperTypes%5B2%5D=3&paperTypes%5B3%5D=4&paperTypes%5B4%5D=5&paperTypes%5B5%5D=6&paperTypes%5B6%5D=7&paperTypes%5B7%5D=8&paperTypes%5B8%5D=9&showTraded=false&withBestLimits=true&hEven=0&RefID=0';

            const legacy =
              'http://old.tsetmc.com/tsev2/data/MarketWatchInit.aspx?h=0&r=0';

            try {
              const j = await getJson(modern);
              const arr = Array.isArray(j)
                ? j
                : (j.marketwatch || j.marketWatch || j.data || []);

              const rows = arr
                .map(normalizeModern)
                .filter(x => x.symbol && x.last !== null);

              if (rows.length) return rows;

              console.log(
                'Modern TSETMC returned zero usable rows; trying legacy.'
              );
            } catch (e) {
              console.log(
                'Modern TSETMC failed:',
                e.message
              );
            }

            const text = await request(legacy, 30000);
            const rows = parseLegacy(text);

            if (!rows.length) {
              throw new Error(
                'TSETMC legacy market watch returned zero usable rows'
              );
            }

            return rows;
          }

          async function clientTypes() {
            try {
              const j = await getJson(
                'https://cdn.tsetmc.com/api/ClientType/GetClientTypeAll'
              );

              const arr = j.clientTypeAllDto || j.data || [];
              const map = new Map();

              for (const x of arr) {
                const id = String(
                  pick(x, ['insCode', 'InsCode']) ?? ''
                );

                if (!id) continue;

                map.set(id, {
                  naturalBuy: n(x.buy_I_Volume),
                  legalBuy: n(x.buy_N_Volume),
                  naturalSell: n(x.sell_I_Volume),
                  legalSell: n(x.sell_N_Volume),
                  naturalBuyCount: n(x.buy_I_Count),
                  legalBuyCount: n(x.buy_N_Count),
                  naturalSellCount: n(x.sell_I_Count),
                  legalSellCount: n(x.sell_N_Count)
                });
              }

              return map;
            } catch (e) {
              console.log(
                'Client type unavailable:',
                e.message
              );
              return new Map();
            }
          }

          async function bestLimits(id) {
            try {
              const j = await getJson(
                'https://cdn.tsetmc.com/api/BestLimits/' +
                encodeURIComponent(id)
              );

              const arr = Array.isArray(j)
                ? j
                : (j.bestLimits || j.data || []);

              let bid = 0;
              let ask = 0;
              let bidOrders = 0;
              let askOrders = 0;

              for (const x of arr) {
                const bv = n(
                  pick(x, ['qTitMeDem', 'buyVolume', 'qBuy'])
                );

                const av = n(
                  pick(x, ['qTitMeOf', 'sellVolume', 'qSell'])
                );

                const bo = n(
                  pick(x, ['zOrdMeDem', 'buyOrders'])
                );

                const ao = n(
                  pick(x, ['zOrdMeOf', 'sellOrders'])
                );

                if (bv !== null) bid += bv;
                if (av !== null) ask += av;
                if (bo !== null) bidOrders += bo;
                if (ao !== null) askOrders += ao;
              }

              return {
                bidDepth: bid || null,
                askDepth: ask || null,
                bidOrders: bidOrders || null,
                askOrders: askOrders || null,
                orderImbalance:
                  (bid || ask)
                    ? (bid - ask) / Math.max(1, bid + ask)
                    : null
              };
            } catch (e) {
              return {};
            }
          }

          async function history(id) {
            try {
              const j = await getJson(
                'https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyList/' +
                encodeURIComponent(id) +
                '/30'
              );

              const arr = Array.isArray(j)
                ? j
                : (j.closingPriceDaily || j.data || []);

              const rows = arr
                .map(x => ({
                  close: n(x.pClosing),
                  vol: n(x.qTotTran5J),
                  date: x.dEven
                }))
                .filter(x => x.close !== null);

              if (!rows.length) return {};

              const vols = rows
                .map(x => x.vol)
                .filter(x => x !== null);

              const avgVol = vols.length
                ? vols.reduce((a, b) => a + b, 0) / vols.length
                : null;

              return {
                avgVol,
                trend20:
                  rows.at(-1).close > rows[0].close
                    ? 'up'
                    : rows.at(-1).close < rows[0].close
                      ? 'down'
                      : 'flat',
                history: rows
              };
            } catch (e) {
              return {};
            }
          }

          async function enrich(rows) {
            const cm = await clientTypes();

            for (const x of rows) {
              Object.assign(
                x,
                cm.get(x.insCode) || {}
              );
            }

            const top = [...rows]
              .sort(
                (a, b) =>
                  (b.value || 0) -
                  (a.value || 0)
              )
              .slice(0, 60);

            for (let i = 0; i < top.length; i += 6) {
              await Promise.all(
                top.slice(i, i + 6).map(async x => {
                  Object.assign(
                    x,
                    await bestLimits(x.insCode)
                  );

                  Object.assign(
                    x,
                    await history(x.insCode)
                  );
                })
              );
            }

            return rows;
          }

          function write(name, payload) {
            fs.writeFileSync(
              path.join(OUT, name),
              JSON.stringify(payload)
            );
          }

          (async () => {
            const rows = await marketWatch();

            console.log(
              'TSETMC usable rows:',
              rows.length
            );

            const enriched = await enrich(rows);

            const stocks =
              enriched.filter(x => x.flow !== 7);

            const commodities =
              enriched.filter(x => x.flow === 7);

            if (!stocks.length) {
              throw new Error(
                'No real stock rows found from TSETMC'
              );
            }

            if (!commodities.length) {
              throw new Error(
                'No real TSETMC flow=7 commodity rows found; refusing fake commodity data'
              );
            }

            const now = Date.now();

            write('stocks.json', {
              schemaVersion: 2,
              source:
                'TSETMC CDN/legacy MarketWatch via GitHub Actions',
              timestamp: now,
              live: false,
              upstreamOk: true,
              marketStatus: 'snapshot',
              dataAgeSec: 0,
              items: stocks
            });

            write('commodities.json', {
              schemaVersion: 2,
              source:
                'TSETMC flow=7 MarketWatch snapshot via GitHub Actions',
              timestamp: now,
              live: false,
              upstreamOk: true,
              marketStatus: 'snapshot',
              dataAgeSec: 0,
              items: commodities
            });

            console.log(
              'stocks=',
              stocks.length,
              'commodities=',
              commodities.length
            );
          })().catch(err => {
            console.error(
              'RADAR_UPDATE_FAILED:',
              err.stack || err.message || err
            );
            process.exit(1);
          });
          NODE

      - name: Update TSETMC snapshots
        run: node scripts/update-radar.js

      - name: Validate snapshots
        run: |
          test -s radar-data/stocks.json
          test -s radar-data/commodities.json
          node -e "const fs=require('fs'); for(const f of ['radar-data/stocks.json','radar-data/commodities.json']) { const j=JSON.parse(fs.readFileSync(f,'utf8')); if(!Array.isArray(j.items)||!j.items.length) throw new Error(f+' has no real items'); console.log(f,'items=',j.items.length,'timestamp=',j.timestamp,'source=',j.source); }"

      - name: Commit updated radar data
        run: |
          git config user.name 'MJK Radar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radar-data/stocks.json radar-data/commodities.json
          if git diff --cached --quiet; then
            echo 'No radar changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update MJK radar data [skip ci]'
          git push
